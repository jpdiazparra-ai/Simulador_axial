<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="view" title="Visualizador interactivo VAWT"></iframe><script>
const view=document.getElementById('view');let current='',pendingNonce=null;
function send(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
window.addEventListener('message',event=>{if(event.source===view.contentWindow&&event.data?.type==='vawt:change'){pendingNonce=event.data.value.nonce;send('streamlit:setComponentValue',{value:event.data.value,dataType:'json'});return}if(event.source===window.parent&&event.data?.type==='streamlit:render'){const args=event.data.args,html=args.html,ack=pendingNonce!==null&&args.ack_nonce===pendingNonce;if(pendingNonce!==null&&!ack)return;if(html!==current||ack){const scroll=view.contentWindow?.scrollY||0,open=[...view.contentDocument.querySelectorAll('details[data-preserve]')].map(e=>e.open);current=html;pendingNonce=null;view.onload=()=>{[...view.contentDocument.querySelectorAll('details[data-preserve]')].forEach((e,i)=>{if(i<open.length)e.open=open[i]});view.contentWindow.scrollTo(0,scroll);view.contentWindow.postMessage({type:'vawt:connected'},'*')};view.srcdoc=html}send('streamlit:setFrameHeight',{height:1400})}});
send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:1400});
</script></body></html>
